
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: Arial, sans-serif;
            background: #0b1120;
            color: white;
        }

        .profile-card {
            width: min(90%, 380px);
            padding: 35px;
            text-align: center;
            border-radius: 20px;
            background: #172033;
            box-shadow: 0 15px 40px #0006;
        }

        .avatar {
            width: 145px;
            height: 145px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #38bdf8;
            background: #0f172a;
        }

        h2 {
            margin-top: 20px;
            color: #38bdf8;
        }

        p {
            color: #cbd5e1;
            overflow-wrap: anywhere;
        }

        a {
            display: inline-block;
            margin-top: 18px;
            padding: 12px 22px;
            border-radius: 8px;
            background: #38bdf8;
            color: #0b1120;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>
<div class="profile-card">

    <img class="avatar"
         th:src="@{${profile.imagepath}}"
         alt="Profile Photo">

    <h2 th:text="${profile.name}">User Name</h2>

    <p>
        Email:
        <span th:text="${profile.email}">user@example.com</span>
    </p>

    <a th:href="@{/user}">Back to Upload Page</a>

</div>
</body>
</html>
