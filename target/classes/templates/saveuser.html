    <title>Profile Saved</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;

        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            box-shadow: 0 0 30px rgba(43, 251, 240, 0.15);
        }

        .icon {
            width: 70px;
            height: 70px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background: #2bfbf0;
            color: #050708;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 35px;
            font-weight: bold;
        }

        h1 {
            color: #2bfbf0;
            margin-bottom: 12px;
        }

        p {
            color: #b8c2c6;
            margin-bottom: 25px;
        }

        a {
            display: inline-block;
            padding: 12px 22px;
            background: #2bfbf0;
            color: #050708;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
        }

        a:hover {
            background: #17c9c0;
        }
